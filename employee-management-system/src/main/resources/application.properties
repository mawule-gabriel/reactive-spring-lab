spring.application.name=employee-management-system
spring.profiles.active=dev

spring.docker.compose.enabled=false

spring.r2dbc.url=${EMS_DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/employee_management_db}
spring.r2dbc.username=${EMS_DB_USERNAME:postgres}
spring.r2dbc.password=${EMS_DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.url=${EMS_DB_JDBC_URL:jdbc:postgresql://localhost:5432/employee_management_db}
spring.flyway.user=${EMS_DB_USERNAME:postgres}
spring.flyway.password=${EMS_DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

app.jwt.secret=${EMS_JWT_SECRET}
app.jwt.expiry-ms=${EMS_JWT_EXPIRY_MS:3600000}

app.admin.email=${EMS_ADMIN_EMAIL:}
app.admin.password=${EMS_ADMIN_PASSWORD:}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.org.springframework.r2dbc=DEBUG
logging.level.org.flywaydb=INFO
logging.level.com.mawule=DEBUG
